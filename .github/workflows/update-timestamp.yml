name: Update profile timestamp

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update timestamp file
        run: |
          echo "LAST_UPDATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > status.env

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.env
          git diff --cached --quiet || git commit -m "chore: update status timestamp"
          git push
