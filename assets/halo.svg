<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
    <stop stop-color="#080A12"/>
    <stop offset="0.55" stop-color="#111522"/>
    <stop offset="1" stop-color="#080A12"/>
  </linearGradient>
  <linearGradient id="neon" x1="200" y1="80" x2="980" y2="290" gradientUnits="userSpaceOnUse">
    <stop stop-color="#00E5FF"/>
    <stop offset="0.5" stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#FF4FD8"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
